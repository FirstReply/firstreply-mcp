# This repository is a read-only mirror of packages/firstreply-mcp in
# FirstReply/firstreply. Releases are cut there: pushing an mcp-vX.Y.Z tag on
# the monorepo splits this subtree and pushes tag vX.Y.Z here, which is what
# triggers the job below.
#
# Publishing uses npm trusted publishing (OIDC): the package's settings on
# npmjs.com trust this repository and this workflow file, so there is no npm
# token. It needs npm 11.5.1 or newer, which Node 24 brings.
name: Publish package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write: the last step creates the GitHub Release
      contents: write
      # Required for npm trusted publishing (provenance).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Guard: the tag must match the version npm will publish.
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public

      # The monorepo pushes a bare tag, so the release page is created here.
      # Not for a manual run, which has no tag.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
