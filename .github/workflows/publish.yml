# This repository is a read-only mirror of packages/firstreply-mcp in
# FirstReply/firstreply. Releases are cut there: pushing an mcp-vX.Y.Z tag on
# the monorepo splits this subtree and pushes tag vX.Y.Z here, which is what
# triggers the job below.
#
# PREREQUISITE: @firstreply/mcp has never been published. Before the first
# release, either configure npm trusted publishing (OIDC) for this repo, or
# replace the OIDC step with an NPM_TOKEN secret. Until then this job fails
# at the publish step and nothing else is affected.
name: Publish package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (provenance).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Guard: the tag must match the version npm will publish.
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
