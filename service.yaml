apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: firstreply-mcp
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    # Only through the load balancer (mcp.firstreply.ai), not the run.app URL.
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    # Public: every request carries the caller's own FirstReply API key, which the API checks.
    run.googleapis.com/invoker-iam-disabled: 'true'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Holds no secrets and calls nothing but the public API: an account without roles.
      serviceAccountName: firstreply-mcp@firstreply.iam.gserviceaccount.com
      containerConcurrency: 80
      # post_media_upload passes a file through; everything else answers in seconds
      timeoutSeconds: 300
      containers:
        - image: europe-west1-docker.pkg.dev/firstreply/firstreply/firstreply-mcp:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          env:
            - name: MCP_ENDPOINT_PATH
              value: "/"
            - name: FIRSTREPLY_API_URL
              value: "https://api.firstreply.ai"
            # The OAuth resource identifier MCP hosts sign in for; the API accepts tokens for it
            - name: MCP_SERVER_URL
              value: "https://mcp.firstreply.ai"
